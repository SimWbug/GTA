name: Build GtaMC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build du plugin
        run: gradle build --no-daemon

      - name: Zip du resource pack
        run: cd resourcepack && zip -r ../GtaMC-ResourcePack.zip . -x ".*"

      - uses: actions/upload-artifact@v4
        with:
          name: GtaMC
          path: |
            build/libs/GtaMC-*.jar
            GtaMC-ResourcePack.zip
